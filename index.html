<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080c">
  <title>cubus.sh</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="booting">
  <canvas id="scene" tabindex="0" aria-label="Interactive three-dimensional cubus navigation"></canvas>
  <button id="terminal-launch" class="terminal-header boot-launch" type="button" aria-label="Execute cubus.sh">
    <span class="prompt">$</span> ./cubus.sh
  </button>
  <div id="boot-prompt" class="boot-prompt" aria-hidden="false">
    <span>[ EXECUTE ]</span>
    <span class="boot-arrow" aria-hidden="true">↓</span>
  </div>
  <div class="corner-mark">SYS / DIMENSIONAL-01</div>
  <div class="hud"><span class="accent" id="mode">CORE ONLINE</span><br><span id="hint">CLICK THE CUBE TO SPLIT</span></div>

  <script src="static/js/script.js"></script>
</body>
</html>
