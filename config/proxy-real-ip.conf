# Only cloudflared and nginx-proxy join this pinned tunnel network. Trust the
# Cloudflare-provided client address only when it arrives over that network.
set_real_ip_from 172.30.0.0/24;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# The generated `vhost` format does not exist until docker-gen's first render.
# Define an equivalent format up front for the static fallback server.
log_format fallback_json escape=json
    '{"time":"$time_iso8601","host":"$host","client_ip":"$remote_addr",'
    '"cf_connecting_ip":"$http_cf_connecting_ip","xff":"$http_x_forwarded_for",'
    '"request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr","referer":"$http_referer",'
    '"user_agent":"$http_user_agent","cf_ray":"$http_cf_ray",'
    '"request_id":"$request_id"}';
