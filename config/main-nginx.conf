server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/xml
        text/xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Never expose dotfiles, but preserve standards-based discovery endpoints.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires 1h;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 1d;
    }

    location /static/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
