name: cubus

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx-proxy:
    build:
      context: ./config
      dockerfile: nginx-proxy.Dockerfile
    restart: unless-stopped
    environment:
      DEFAULT_ROOT: "404"
      LOG_FORMAT: >-
        {"time":"$$time_iso8601","host":"$$host","client_ip":"$$remote_addr","cf_connecting_ip":"$$http_cf_connecting_ip","xff":"$$http_x_forwarded_for","request":"$$request","status":$$status,"body_bytes_sent":$$body_bytes_sent,"request_time":$$request_time,"upstream_response_time":"$$upstream_response_time","upstream_addr":"$$upstream_addr","referer":"$$http_referer","user_agent":"$$http_user_agent","cf_ray":"$$http_cf_ray","request_id":"$$request_id"}
      LOG_JSON: "true"
      NO_COLOR: "1"
      TRUST_DOWNSTREAM_PROXY: "true"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/tmp/docker.sock:ro
      - ./config/proxy-real-ip.conf:/etc/nginx/conf.d/00-real-ip.conf:ro
      - ./config/proxy-fallback.conf:/etc/nginx/conf.d/zz-fallback.conf:ro
      - ./config/vhost.d:/etc/nginx/vhost.d:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q -O /dev/null --header='Host: cubus.sh' http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *default-logging
    networks:
      - tunnel
      - web

  main:
    extends:
      file: ./sites/main/compose.service.yml
      service: main
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: cubus.sh
      VIRTUAL_PORT: "80"
    logging: *default-logging
    networks:
      - web

  audown:
    extends:
      file: ./sites/audown/compose.service.yml
      service: audown
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: audown.cubus.sh
      VIRTUAL_PORT: "8080"
      PUBLIC_BASE_URL: "https://audown.cubus.sh"
      DB_BROKER_URL: "http://db-broker:8080/v1/database"
      ADMIN_BIND_CIDR: "172.31.0.0/24"
      ADMIN_ALLOW_CIDR: "172.31.0.2/32"
    labels:
      cubus.admin.port: "9090"
      cubus.admin.name: "audown"
    depends_on:
      db-broker:
        condition: service_healthy
    logging: *default-logging
    networks:
      - web
      - web-external
      - db
      - admin

  choice:
    extends:
      file: ./sites/choice/compose.service.yml
      service: choice
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: choice.cubus.sh
      VIRTUAL_PORT: "8000"
      DB_BROKER_URL: "http://db-broker:8080/v1/database"
      ADMIN_BIND_CIDR: "172.31.0.0/24"
      ADMIN_ALLOW_CIDR: "172.31.0.2/32"
    labels:
      cubus.admin.port: "9090"
      cubus.admin.name: "choice"
    depends_on:
      db-broker:
        condition: service_healthy
    logging: *default-logging
    networks:
      - web
      - db
      - admin

  artifact:
    extends:
      file: ./sites/artifact/compose.service.yml
      service: artifact
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: artifact.cubus.sh
      VIRTUAL_PORT: "8000"
      PUBLIC_BASE_URL: "https://artifact.cubus.sh"
      DB_BROKER_URL: "http://db-broker:8080/v1/database"
      ADMIN_BIND_CIDR: "172.31.0.0/24"
      ADMIN_ALLOW_CIDR: "172.31.0.2/32"
    labels:
      cubus.admin.port: "9090"
      cubus.admin.name: "artifact"
    depends_on:
      db-broker:
        condition: service_healthy
    logging: *default-logging
    networks:
      - web
      - db
      - admin

  admin:
    extends:
      file: ./sites/admin/compose.service.yml
      service: admin
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: admin.cubus.sh
      VIRTUAL_PORT: "8000"
      PUBLIC_BASE_URL: "https://admin.cubus.sh"
      DB_BROKER_URL: "http://db-broker:8080/v1/database"
      DB_STATS_URL: "http://db-broker:8080/v1/admin/stats"
      OPS_AGENT_URL: "http://ops-agent:9091"
      ADMIN_NETWORK_CIDR: "172.31.0.0/24"
    depends_on:
      db-broker:
        condition: service_healthy
      ops-agent:
        condition: service_healthy
    logging: *default-logging
    networks:
      web: {}
      web-external: {}
      db: {}
      admin:
        ipv4_address: 172.31.0.2

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - "${TUNNEL_PROTOCOL:-auto}"
      - run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}"
    depends_on:
      nginx-proxy:
        condition: service_healthy
        restart: true
      main:
        condition: service_healthy
        restart: true
    logging: *default-logging
    networks:
      - tunnel

  postgres:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
    shm_size: 256m
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - db

  db-broker:
    build:
      context: ./infra/db-broker
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LISTEN_ADDR: ":8080"
      DOCKER_SOCKET: "/var/run/docker.sock"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      ROLE_CONNECTION_LIMIT: "15"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/db-broker", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging
    networks:
      - db

  ops-agent:
    build:
      context: ./infra/ops-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ADMIN_PORT: "9091"
      ADMIN_BIND_CIDR: "172.31.0.0/24"
      DOCKER_SOCKET: "/var/run/docker.sock"
      ALLOWED_SERVICE: "admin"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /etc/os-release:/host/etc/os-release:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    expose:
      - "9091"
    healthcheck:
      test: ["CMD", "/ops-agent", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging
    networks:
      - admin

networks:
  tunnel:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  web:
    driver: bridge
    internal: true
  web-external:
    driver: bridge
  db:
    driver: bridge
    internal: true
  admin:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
          ip_range: 172.31.0.128/25

volumes:
  postgres-data:
    driver: local
