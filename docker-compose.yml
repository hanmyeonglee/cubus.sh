name: cubus

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11-alpine
    restart: unless-stopped
    environment:
      DEFAULT_ROOT: "404"
      LOG_FORMAT: >-
        {"time":"$$time_iso8601","host":"$$host","client_ip":"$$remote_addr","cf_connecting_ip":"$$http_cf_connecting_ip","xff":"$$http_x_forwarded_for","request":"$$request","status":$$status,"body_bytes_sent":$$body_bytes_sent,"request_time":$$request_time,"upstream_response_time":"$$upstream_response_time","upstream_addr":"$$upstream_addr","referer":"$$http_referer","user_agent":"$$http_user_agent","cf_ray":"$$http_cf_ray","request_id":"$$request_id"}
      LOG_JSON: "true"
      NO_COLOR: "1"
      TRUST_DOWNSTREAM_PROXY: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./config/proxy-real-ip.conf:/etc/nginx/conf.d/00-real-ip.conf:ro
      - ./config/proxy-fallback.conf:/etc/nginx/conf.d/zz-fallback.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q -O /dev/null --header='Host: cubus.sh' http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *default-logging
    networks:
      - tunnel
      - web

  main:
    build:
      context: ./sites/main
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: cubus.sh
      VIRTUAL_PORT: "80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *default-logging
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - "${TUNNEL_PROTOCOL:-auto}"
      - run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}"
    depends_on:
      nginx-proxy:
        condition: service_healthy
        restart: true
      main:
        condition: service_healthy
        restart: true
    logging: *default-logging
    networks:
      - tunnel

networks:
  tunnel:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  web:
    driver: bridge
    internal: true
