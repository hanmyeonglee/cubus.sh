name: cubus

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    expose:
      - "80"
    networks:
      - tunnel
      - web

  main:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: cubus.sh
      VIRTUAL_PORT: "80"
    expose:
      - "80"
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}"
    depends_on:
      - nginx-proxy
      - main
    networks:
      - tunnel

networks:
  tunnel:
    driver: bridge
  web:
    driver: bridge
    internal: true
